# StockBot configuration.
#
# Everything here is safe to commit - no secrets. API keys go in .env
# (copy .env.example -> .env, which is gitignored).

# Fixed watchlist - the bot only ever looks at symbols listed here, not
# the whole market. Chosen for liquidity/data quality (large, heavily
# traded names give indicators clean signal), not as a prediction that
# any of them will go up - that's what backtesting and the dashboard are
# for, not this list. Spread across sectors so the bot isn't just making
# one big correlated bet on "tech had a good/bad day."
symbols:
  # Tech
  - AAPL
  - MSFT
  - NVDA
  - GOOGL
  - AMZN
  - META
  - AMD
  - INTC
  - CRM
  - ADBE
  - ORCL
  - CSCO
  - NFLX
  # Financials
  - JPM
  - V
  - MA
  - BAC
  # Healthcare
  - JNJ
  - UNH
  - PFE
  # Consumer
  - WMT
  - HD
  - COST
  - KO
  - PEP
  - PG
  # Industrial / Energy / Media
  - XOM
  - DIS

starting_balance: 100000.0
polling_interval_seconds: 60
# While the market is closed, re-check/heartbeat at most this often instead
# of the normal polling_interval_seconds pace. Also used by the dashboard's
# "running" vs "stale" status check, which must tolerate this slower cadence.
max_closed_market_heartbeat_seconds: 1800
log_level: INFO
log_file: logs/stockbot.log

data:
  # "synthetic" (deterministic dev/test data, no API key needed),
  # "csv" (reads data_files/{SYMBOL}.csv), or "alpaca" (real paper market data).
  # alpaca requires ALPACA_API_KEY / ALPACA_SECRET_KEY in .env - switch
  # back to "synthetic" any time for a zero-setup, offline, reproducible run.
  provider: alpaca
  csv_dir: data_files
  timeframe: 1Day
  history_lookback_days: 180
  # "auto" (alpaca's real market hours+holidays if provider: alpaca, else
  # always_open), "always_open", "us_equity" (Mon-Fri 9:30-16:00 ET, no
  # holiday awareness, no network), or "alpaca" (exact, needs credentials).
  # The live loop (`main.py run`) uses this to skip trading while the
  # market is closed instead of blindly polling/filling at a stale price.
  market_calendar: auto

news:
  # "none" (default - the strategy works fine without news) or "alpaca".
  provider: alpaca
  # "none" (no scoring), "lexicon" (default, no API key needed), or "llm" (optional, needs ANTHROPIC_API_KEY).
  sentiment_scorer: lexicon

strategy:
  # "technical" (trend-following) or "mean_reversion" (contrarian) - see strategy/registry.py.
  # Set to mean_reversion 2026-08-16: over a 120-day backtest window (a
  # semester-length proxy) across AAPL/NVDA/CRM/ADBE/INTC/JPM, it
  # consistently matched or beat technical - notably on AAPL and NVDA,
  # where technical's one trade was a full loser (0% win rate) while
  # mean_reversion won on every trade. Re-run `main.py backtest --compare`
  # periodically once the semester is actually underway - 120 days of
  # recent history is not a promise about the next 90.
  name: mean_reversion
  weights:
    technical: 0.30
    momentum: 0.25
    volume: 0.20
    risk: 0.15
    sentiment: 0.10
  buy_threshold: 0.25
  sell_threshold: -0.25
  sma_short_period: 10
  sma_long_period: 30
  ema_period: 12
  rsi_period: 14
  rsi_overbought: 70.0
  rsi_oversold: 30.0
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  momentum_period: 10
  volume_period: 10
  volatility_period: 20
  min_history_bars: 35

risk:
  max_position_size_pct: 0.20
  max_portfolio_exposure_pct: 0.80
  max_open_positions: 8
  max_trades_per_symbol_per_day: 3
  stop_loss_pct: 0.08
  take_profit_pct: 0.20
  min_cash_reserve_pct: 0.05

execution:
  # "paper" (simulated fills, updates the portfolio automatically) or
  # "manual" (logs a suggestion for a human to execute; no auto-fill).
  mode: paper
  slippage_bps: 5.0
  commission_per_trade: 0.0
  commission_pct: 0.0
  # Optional (mode: paper only): also best-effort mirror every fill to
  # your own Alpaca PAPER account so trades show up on Alpaca's dashboard
  # too. Purely cosmetic - the local ledger above is still what everything
  # (risk checks, portfolio value, the StockBot dashboard) is driven by.
  mirror_to_alpaca: false

database:
  url: sqlite:///./stockbot.db

backtest:
  starting_balance: 100000.0
  warmup_bars: 40
